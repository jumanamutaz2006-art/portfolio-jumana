<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
  <title>Illustration of the Halo smart home-safety car</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#330C4B"/><stop offset="1" stop-color="#711E7B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="520" cy="80" r="120" fill="#B9379D" opacity="0.3"/>
  <rect x="0" y="262" width="640" height="98" fill="#330C4B" opacity="0.7"/>
  <!-- car body -->
  <rect x="170" y="170" width="300" height="70" rx="22" fill="#EEDAA5"/>
  <rect x="230" y="128" width="170" height="60" rx="20" fill="#E3A88A"/>
  <rect x="246" y="140" width="64" height="38" rx="8" fill="#330C4B"/>
  <rect x="322" y="140" width="64" height="38" rx="8" fill="#330C4B"/>
  <circle cx="240" cy="246" r="26" fill="#330C4B" stroke="#EEDAA5" stroke-width="6"/>
  <circle cx="400" cy="246" r="26" fill="#330C4B" stroke="#EEDAA5" stroke-width="6"/>
  <!-- sensor and alert -->
  <circle cx="320" cy="108" r="10" fill="#B9379D"/>
  <path d="M296 92 q24 -22 48 0" fill="none" stroke="#EEDAA5" stroke-width="4" stroke-linecap="round"/>
  <path d="M282 76 q38 -38 76 0" fill="none" stroke="#EEDAA5" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <text x="320" y="318" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#EEDAA5" text-anchor="middle" letter-spacing="6">HALO</text>
</svg>
