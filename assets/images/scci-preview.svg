<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
  <title>Illustration of a website connected to a server and database</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#330C4B"/><stop offset="1" stop-color="#711E7B"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="560" cy="60" r="110" fill="#B9379D" opacity="0.28"/>
  <circle cx="70" cy="320" r="90" fill="#E3A88A" opacity="0.18"/>
  <!-- front-end window -->
  <rect x="60" y="90" width="190" height="150" rx="12" fill="#330C4B" stroke="#EEDAA5" stroke-width="3"/>
  <rect x="60" y="90" width="190" height="28" rx="12" fill="#51017C"/>
  <circle cx="80" cy="104" r="5" fill="#EEDAA5"/><circle cx="98" cy="104" r="5" fill="#E3A88A"/>
  <rect x="80" y="134" width="110" height="10" rx="5" fill="#EEDAA5"/>
  <rect x="80" y="154" width="150" height="8" rx="4" fill="#E3A88A" opacity="0.8"/>
  <rect x="80" y="172" width="130" height="8" rx="4" fill="#E3A88A" opacity="0.8"/>
  <rect x="80" y="196" width="70" height="22" rx="11" fill="#B9379D"/>
  <!-- back-end database -->
  <ellipse cx="500" cy="120" rx="64" ry="20" fill="#EEDAA5"/>
  <path d="M436 120 v90 a64 20 0 0 0 128 0 v-90" fill="#E3A88A"/>
  <ellipse cx="500" cy="120" rx="64" ry="20" fill="#EEDAA5"/>
  <path d="M436 156 a64 20 0 0 0 128 0" fill="none" stroke="#330C4B" stroke-width="3"/>
  <path d="M436 188 a64 20 0 0 0 128 0" fill="none" stroke="#330C4B" stroke-width="3"/>
  <!-- connection -->
  <path d="M250 165 H436" stroke="#EEDAA5" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <polygon points="436,165 422,157 422,173" fill="#EEDAA5"/>
  <polygon points="250,165 264,157 264,173" fill="#EEDAA5"/>
  <g font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#EEDAA5" text-anchor="middle" letter-spacing="3">
    <text x="155" y="276">FRONT-END</text>
    <text x="500" y="276">BACK-END</text>
    <text x="320" y="326" font-size="26" letter-spacing="6">SCCI</text>
  </g>
</svg>
